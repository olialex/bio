  <title>Link in Bio - Minimal Project</title>

<body>

  <main class="app-container">
    
    <!-- 📍 SECCIÓN 1: HERO MINIMALISTA CON FONDO ROTATIVO (100dvh) -->
    <section class="hero-section">
      
      <!-- Fondo rotativo optimizado -->
      <div class="hero-bg-slideshow"></div>
      <div class="hero-gradient-overlay"></div>

      <!-- Contenido Principal -->
      <div class="hero-content">
        
        <!-- Foto de Perfil -->
        <div class="profile-hero-wrapper">
          <img src="https://via.placeholder.com/300" alt="Foto de Perfil" class="hero-avatar" id="user-avatar" />
          <div class="avatar-ring"></div>
        </div>

        <!-- Textos -->
        <div class="hero-texts">
          <h1 class="username" id="user-name">Tu Nombre</h1>
          <h2 class="subtitle" id="user-subtitle">Artista & Ilustrador Digital</h2>
          <p class="bio" id="user-bio">Explorando mundos a través del trazo. Bienvenidos a mi universo. ✨</p>
        </div>

</svg>

        </div>

      </div>

      <!-- Indicador de Scroll -->
      <div class="scroll-indicator">
        <span>Ver más</span>
        <span class="arrow">↓</span>
      </div>

    </section>

    <!-- 📍 SECCIÓN 2: GRID DINÁMICO DE PROYECTOS -->
    <section class="project-section">
      <div class="project-links-grid" id="links-container">
        <!-- Los elementos de linksData.js se inyectarán aquí automáticamente -->
      </div>
    </section>

    <img src="" alt="" loading="lazy">

    <!-- 📍 SECCIÓN 3: CONTACTO (100dvh) -->
    <section class="contact-section">
      <div class="contact-card">
        
        <div class="contact-header">
          <h2 class="contact-title">¿Hablamos? ✉️</h2>
          <p class="contact-subtitle">¿Tienes un proyecto en mente o quieres encargar una ilustración? Escríbeme.</p>
        </div>

        <form class="contact-form" action="https://formspree.io/f/tu-codigo-aqui" method="POST">
          
          <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" id="name" name="name" placeholder="Tu nombre" required />
          </div>

          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="_replyto" placeholder="tu@correo.com" required />
          </div>

          <div class="form-group">
            <label for="message">Mensaje</label>
            <textarea id="message" name="message" rows="4" placeholder="Cuéntame sobre tu idea..." required></textarea>
          </div>

          <button type="submit" class="submit-btn">Enviar Mensaje 🚀</button>

        </form>

      </div>
    </section>
